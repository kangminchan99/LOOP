name: loop
description: 'A new Flutter project.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  go_router: ^17.2.2
  flutter_riverpod: ^2.6.1
  dio: ^5.9.2
  flutter_dotenv: ^6.0.1
  logging: ^1.3.0
  flutter_secure_storage: ^10.2.0
  equatable: ^2.0.8
  fpdart: ^1.2.0
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  kakao_flutter_sdk_user: ^1.10.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: ^6.13.2
  freezed: ^3.2.5
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/icons/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900
